name: LG custom 2.0.7 host checks
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: lg-custom-207-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=0
      LIBGL_ALWAYS_SOFTWARE: '1'
      NUVIO_DTS_ROOT: /tmp/nuvio-dts-host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config ffmpeg curl python3 xvfb xauth libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev libssl-dev
      - name: Version, text, RAM, diagnostics and controller
        if: ${{ !cancelled() }}
        run: |
          git diff --check
          bash tests/versao_207.sh
          bash tests/buffer_tamanho.sh
          bash tests/textwrap.sh
          bash tests/logexport.sh
          bash tests/memlog.sh
          bash tests/playback_ram.sh
          bash tests/celular_export.sh
          bash tests/dts_playback.sh
          SANITIZE=1 bash tests/dts_playback.sh
          bash tests/video_acb_lg.sh
          bash tests/video_buffer_teardown.sh
      - name: Settings migration and source list rendering
        if: ${{ !cancelled() }}
        run: |
          bash tests/playback_ram_settings.sh
          xvfb-run -a bash tests/fontes_formatter.sh
      - name: Build minimal host FFmpeg
        if: ${{ !cancelled() }}
        env:
          NUVIO_DTS_HOST: '1'
          CC: gcc
        run: bash tools/build-dts-ffmpeg.sh
      - name: HTTP, conversion and buffer recovery
        if: ${{ !cancelled() }}
        run: |
          bash tests/moviebuffer.sh
          bash tests/dts_buffer64.sh
          bash tests/dts_range_retry.sh
          SANITIZE=1 bash tests/dts_range_retry.sh
          bash tests/dts_timestamp_engine.sh
          SANITIZE=1 bash tests/dts_timestamp_engine.sh
          bash tests/dts_engine.sh
      - name: Dolby Vision MEL and FEL metadata conversion
        if: ${{ !cancelled() }}
        run: |
          bash tests/dv7.sh
          bash tests/dv7_engine.sh
          bash tests/dv7_mkvcore_link.sh
